; Friend or Foe -- Legacy WROOM32 Experimental Probe
; Isolated from production S3 scanner/uplink environments.

[platformio]
default_envs = wroom32-probe

[env:wroom32-probe]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -DLEGACY_WROOM32_PROBE=1